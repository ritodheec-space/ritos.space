<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Art — Ritodhee Chatterjee</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/art.css">
</head>
<body>

  <div class="blur-overlay" id="blurOverlay"></div>

  <nav class="circle-menu" id="circleMenu" aria-label="Site navigation">
    <svg class="circle-ring" viewBox="0 0 270 270" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <path stroke="rgba(255,255,255,0.88)" stroke-width="0.75" fill="none"
        d="M 170 10  A 130 130 0 0 1 264 119
           M 264 151 A 130 130 0 0 1 170 260
           M 100 260 A 130 130 0 0 1 6   151
           M 6   119 A 130 130 0 0 1 100 10"/>
    </svg>
    <a href="index.html"    class="menu-item menu-top">.space</a>
    <a href="about.html"    class="menu-item menu-bottom">.info</a>
    <a href="art.html"      class="menu-item menu-right">.art</a>
    <a href="projects.html" class="menu-item menu-left">.projects</a>
    <span class="menu-item menu-center">.ritos</span>
  </nav>

  <!-- Artwork list toggle (top-left) -->
  <div class="art-list-wrap" id="artListWrap">
    <button class="art-list-btn" id="artListBtn" aria-label="Artwork list" aria-expanded="false">
      <svg width="18" height="14" viewBox="0 0 18 14" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <rect y="0"  width="18" height="1.5" rx="0.75" fill="currentColor"/>
        <rect y="6"  width="18" height="1.5" rx="0.75" fill="currentColor"/>
        <rect y="12" width="18" height="1.5" rx="0.75" fill="currentColor"/>
      </svg>
    </button>
    <ul class="art-list-dropdown" id="artListDropdown" role="menu"></ul>
  </div>

  <main class="art-page">
    <canvas id="artCanvas"></canvas>
    <div class="art-tooltip" id="artTooltip"></div>
    <h1 class="artworks-title">Artworks</h1>
  </main>

  <!-- Three.js r128 — served locally -->
  <script src="js/three.min.js"></script>
  <script src="js/main.js"></script>
  <script src="js/art-3d.js"></script>
  <script>
    /* ── Artwork list dropdown ── */
    (function () {
      var wrap = document.getElementById('artListWrap');
      var btn  = document.getElementById('artListBtn');
      var ul   = document.getElementById('artListDropdown');

      var sorted = ARTWORKS.slice().sort(function(a, b) {
        return a.name.localeCompare(b.name);
      });

      sorted.forEach(function(a) {
        var li = document.createElement('li');
        var el = document.createElement('a');
        el.href        = a.url;
        el.textContent = a.name;
        el.setAttribute('role', 'menuitem');
        li.appendChild(el);
        ul.appendChild(li);
      });

      btn.addEventListener('click', function(e) {
        e.stopPropagation();
        var isOpen = wrap.classList.toggle('open');
        btn.setAttribute('aria-expanded', String(isOpen));
      });

      document.addEventListener('click', function() {
        wrap.classList.remove('open');
        btn.setAttribute('aria-expanded', 'false');
      });

      wrap.addEventListener('click', function(e) { e.stopPropagation(); });
    })();
  </script>

  <script>
    /* Surface any uncaught error so a blank page is never silent */
    window.addEventListener('error', function(e) {
      document.body.insertAdjacentHTML('beforeend',
        '<pre style="position:fixed;bottom:0;left:0;right:0;background:#fee;color:#900;padding:12px;font-size:12px;z-index:999;white-space:pre-wrap">'
        + e.message + '\n' + (e.filename||'') + ':' + e.lineno + '</pre>');
    });
  </script>
</body>
</html>
