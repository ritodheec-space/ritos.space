  <!-- Project dock (centered) -->
  <nav class="proj-dock" id="projDock" aria-label="Project navigation"></nav>

    <div class="projects-bg" id="projectsBg"></div>
  </main>

  <script src="js/main.js"></script>
  <script src="js/projects-data.js"></script>
  <script>
    /* ── Project dock ── */
    (function () {
      var dock   = document.getElementById('projDock');
      var bg     = document.getElementById('projectsBg');
      var BASE   = 15, MAX = 27, RADIUS = 110;

      PROJECTS.forEach(function(p) {
        var a           = document.createElement('a');
        a.href          = p.url;
        a.textContent   = p.name;
        a.className     = 'proj-dock-item';
        if (p.img) {
          new Image().src = p.img;
          a.addEventListener('mouseenter', function() {
            bg.style.backgroundImage = 'url("' + p.img + '")';
            bg.classList.add('active');
          });
          a.addEventListener('mouseleave', function() {
            bg.classList.remove('active');
          });
        }
        dock.appendChild(a);
      });

      var links = Array.from(dock.querySelectorAll('a'));

      dock.addEventListener('mousemove', function(e) {
        var my = e.clientY;
        links.forEach(function(link) {
          var rect = link.getBoundingClientRect();
          var cy   = rect.top + rect.height / 2;
          var dist = Math.abs(my - cy);
          var t    = Math.max(0, 1 - dist / RADIUS);
          link.style.fontSize = (BASE + (MAX - BASE) * t).toFixed(1) + 'px';
        });
      });

      dock.addEventListener('mouseleave', function() {
        links.forEach(function(link) { link.style.fontSize = ''; });
      });
    })();
  </script>

  <script>
    /* Surface any uncaught error so a blank page is never silent */
    window.addEventListener('error', function(e) {
      document.body.insertAdjacentHTML('beforeend',
        '<pre style="position:fixed;bottom:0;left:0;right:0;background:#fee;color:#900;padding:12px;font-size:12px;z-index:999;white-space:pre-wrap">'
        + e.message + '\n' + (e.filename||'') + ':' + e.lineno + '</pre>');
    });
  </script>
</body>
